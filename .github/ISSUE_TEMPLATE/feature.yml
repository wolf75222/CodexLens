name: Feature request
description: Suggest an improvement to session inspection.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how it fits into session inspection and existing navigation.
    validations:
      required: true

