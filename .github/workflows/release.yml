name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check version and main ancestry
        run: |
          python3 scripts/release_notes.py check --tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must identify a commit on main."
            exit 1
          fi
  verify:
    name: Verify release
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    name: Publish verified artifacts
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lens-${{ github.sha }}
          path: dist/release
      - name: Verify exact revision and checksums
        run: |
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python3 -c 'import json,os; m=json.load(open("dist/release/release-metadata.json")); assert m["sourceCommit"]==os.environ["GITHUB_SHA"] and m["version"]==os.environ["VERSION"] and m["dirty"] is False'
          cd dist/release
          sha256sum --check CHECKSUMS.sha256
      - name: Publish after successful verification
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release already exists. Do not replace published artifacts automatically."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --target "$GITHUB_SHA" --draft --title "Codex Lens $VERSION" --notes-file "docs/releases/$VERSION.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
