name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Validated application version
        value: ${{ jobs.validate.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test and package
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LENS_BUILD_DIR: ${{ github.workspace }}/.build/ci
      LENS_APP_PATH: ${{ github.workspace }}/dist/Codex Lens.app
      LENS_VERIFY_LOCAL_CODEX_METADATA: '0'
      LENS_VERIFY_LIVE_CONVERSATION: '0'
      LENS_VERIFY_LIVE_CODEX: '0'
      LENS_VERIFY_LIVE_RESUME: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Toolchain identity
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          python3 --version
          uname -m
      - name: Public source and documentation checks
        run: python3 scripts/check-repository.py
      - name: Script syntax and packaging regression tests
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
          python3 -m unittest discover -s scripts/tests -v
      - name: Swift tests
        run: bash scripts/test.sh -c release -Xswiftc -g --jobs 3
      - name: Build native app with symbols
        run: bash scripts/build.sh --profile
      - name: Native AppKit icon tests
        run: bash scripts/test-app-icon.sh "$RUNNER_TEMP/icon-receipt.json"
      - name: Timeline appearance regression
        run: |
          corpus="/private/tmp/lens-ci-timeline-corpus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          timeline="/private/tmp/lens-ci-timeline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/create-curves-corpus-v77.py --output "$corpus" --events 600
          zsh scripts/verify-design-v07.sh --source-root "$PWD" --output "$timeline" --corpus "$corpus" --entrypoint TimelineAppearanceV78Main.swift --after-source-freeze --run
          mkdir -p dist/ui-validation/timeline
          cp "$timeline/native-design-v07-receipt.json" dist/ui-validation/timeline/receipt.json
          cp "$timeline/"*.png dist/ui-validation/timeline/
      - name: Session curves regression
        env:
          LENS_CURVES_COMPACT_LAYOUT: "1"
        run: |
          corpus="/private/tmp/lens-ci-curves-corpus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curves="/private/tmp/lens-ci-curves-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/create-curves-corpus-v77.py --output "$corpus" --events 600
          zsh scripts/verify-design-v07.sh --source-root "$PWD" --output "$curves" --corpus "$corpus" --entrypoint SessionCurvesV77Main.swift --after-source-freeze --run
          mkdir -p dist/ui-validation/curves
          cp "$curves/native-design-v07-receipt.json" dist/ui-validation/curves/receipt.json
          cp "$curves/"*.png dist/ui-validation/curves/
      - name: Offline native UI smoke
        run: |
          corpus="/private/tmp/lens-ci-corpus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          renders="/private/tmp/lens-ci-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/create-origin-corpus-v21.py --output "$corpus" --events 600
          zsh scripts/verify-design-v07.sh --source-root "$PWD" --output "$renders" --corpus "$corpus" --entrypoint PublicDocsMain.swift --after-source-freeze --run
          mkdir -p dist/ui-validation
          cp "$renders/native-design-v07-receipt.json" dist/ui-validation/receipt.json
          cp "$renders/"*.png dist/ui-validation/
      - name: Workspace navigation regression
        run: |
          corpus="/private/tmp/lens-ci-corpus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          navigation="/private/tmp/lens-ci-navigation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          zsh scripts/verify-design-v07.sh --source-root "$PWD" --output "$navigation" --corpus "$corpus" --entrypoint WorkspaceNavigationV76Main.swift --after-source-freeze --run
          mkdir -p dist/ui-validation/navigation
          cp "$navigation/native-design-v07-receipt.json" dist/ui-validation/navigation/receipt.json
          cp "$navigation/"*.png dist/ui-validation/navigation/
      - name: SwiftUI window scene regression
        run: |
          corpus="/private/tmp/lens-ci-corpus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scenes="/private/tmp/lens-ci-scenes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          zsh scripts/verify-design-v07.sh --source-root "$PWD" --output "$scenes" --corpus "$corpus" --entrypoint WorkspaceSceneV76Main.swift --after-source-freeze --run
          mkdir -p dist/ui-validation/scenes
          cp "$scenes/native-design-v07-receipt.json" dist/ui-validation/scenes/receipt.json
          cp "$scenes/"*.png dist/ui-validation/scenes/
      - name: Control color regression
        run: |
          corpus="/private/tmp/lens-ci-corpus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          colors="/private/tmp/lens-ci-colors-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          zsh scripts/verify-design-v07.sh --source-root "$PWD" --output "$colors" --corpus "$corpus" --entrypoint ControlColorsMain.swift --after-source-freeze --run
          mkdir -p dist/ui-validation/colors
          cp "$colors/native-design-v07-receipt.json" dist/ui-validation/colors/receipt.json
      - name: Signed update regression
        run: |
          updates="/private/tmp/lens-ci-updates-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/verify-updates.sh --artifacts "$LENS_BUILD_DIR/artifacts" --output "$updates"
          mkdir -p dist/ui-validation/updates
          cp "$updates/receipt.json" dist/ui-validation/updates/receipt.json
      - name: Package and verify installer
        run: bash scripts/package-release.sh --app "$LENS_APP_PATH" --output dist/release
      - name: Release version
        id: version
        run: python3 -c 'import plistlib,os; d=plistlib.load(open("Support/Info.plist","rb")); open(os.environ["GITHUB_OUTPUT"],"a").write("version="+d["CFBundleShortVersionString"]+"\n")'
      - name: Collect native diagnostics
        if: always()
        run: |
          mkdir -p dist/native-diagnostics
          for kind in ui navigation scenes curves timeline; do
            probe="/private/tmp/lens-ci-${kind}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            mkdir -p "dist/native-diagnostics/$kind"
            for file in native-design-v07-receipt.json process-receipt.json phase.json scene-phase.json runtime.log build.log toolchain.log; do
              if [ -f "$probe/$file" ]; then cp "$probe/$file" "dist/native-diagnostics/$kind/"; fi
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-diagnostics-${{ github.sha }}
          path: dist/native-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-lens-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ui-${{ github.sha }}
          path: dist/ui-validation/
          if-no-files-found: error
          retention-days: 7
